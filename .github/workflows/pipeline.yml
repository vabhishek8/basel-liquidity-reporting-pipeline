name: Basel Liquidity Reporting Pipeline

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 19 * * *"  # daily, after the sibling projects' scheduled runs
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=src pytest tests/ -v

  run-pipeline:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=src python src/pipeline.py
      - name: Commit refreshed gold data and dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/gold docs/index.html
          git diff --staged --quiet && echo "No changes to commit" || git commit -m "chore: scheduled liquidity reporting refresh [skip ci]"
          git push
